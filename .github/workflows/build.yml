name: APK Derle
on:
  push:
  workflow_dispatch:
concurrency:
  group: apk-derle
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sesleri ac
        run: |
          mkdir -p assets/sesler
          if [ -f sesler.zip ]; then unzip -o -q sesler.zip -d assets/sesler; fi
      - run: flutter create --platforms=android --project-name akor_studyo .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: akor-studyo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

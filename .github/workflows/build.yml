name: APK Derle

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-derle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Sesleri ac
        run: |
          mkdir -p assets/sesler
          if [ -f sesler.zip ]; then
            unzip -o -q sesler.zip -d assets/sesler;
          fi
          for z in sesler_*.zip; do
            if [ -f "$z" ]; then
              unzip -o -q "$z" -d assets/sesler;
            fi
          done
          
      - name: Flutter Pub Get
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - uses: actions/upload-artifact@v4
        with:
          name: akor-studyo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

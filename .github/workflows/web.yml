name: Web Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Sesleri ac
        run: |
          mkdir -p assets/sesler
          if [ -f sesler.zip ]; then unzip -o -j -q sesler.zip -d assets/sesler; fi
          for z in sesler_*.zip; do
            if [ -f "$z" ]; then
              unzip -o -j -q "$z" -d assets/sesler
            fi
          done
      - run: flutter create --platforms=web --project-name akor_studyo .
      - run: flutter pub get
      - run: flutter build web --base-href /akor-studyo/
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
